[package]
name    = "colibri"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "colibri"
path = "src/main.rs"

[dependencies]
# Deshredder — the standalone shred→entries assembly library (fast lane).
deshredder = { git = "https://github.com/VladyslavHontar/Deshreder.git" }

# The P2P complete lane: gossip join + repair protocol + Blockstore
# reconstruction (workspace member).
shred-net = { path = "../shred-net" }

# solana-ledger: reused ONLY for faithful shred sigverify (shred::layout merkle-root
# extraction). agave-unstable-api exposes the `shred` module — same feature and
# agave tag (v3.1.5) as deshredder, so no extra rocksdb build / native lib conflict.
solana-ledger = { git = "https://github.com/anza-xyz/agave.git", tag = "v3.1.5", features = ["agave-unstable-api"] }

# Pin leaf crates to the exact agave v3.1.5 workspace versions.
# (The gossip/repair/reconstruction stack lives in the shred-net crate.)
solana-keypair    = "=3.0.1"
solana-signer     = "=3.0.0"
solana-pubkey     = "=3.0.0"
solana-signature  = { version = "=3.1.0", default-features = false }

# gRPC
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"

# Async + utils
tokio      = { workspace = true }
anyhow     = { workspace = true }
bincode    = { workspace = true }
serde_json = "1"
subtle     = "2"
env_logger = "0.11"

[build-dependencies]
tonic-build = "0.12"
