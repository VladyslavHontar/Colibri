syntax = "proto3";
package shredstream;

message Entry {
    uint64 slot    = 1;
    bytes  entries = 2;
    // True only on the emission that finished the slot (the LAST_SHRED_IN_SLOT
    // entry batch). Entry batches are streamed in-order as they complete; the
    // assembler blocks on any gap, so a `complete = true` message guarantees
    // every prior batch of this slot was already emitted. A subscriber that
    // never sees `complete = true` for a slot (the slot was dropped on an
    // unfillable gap) holds only a prefix and MUST NOT replay it as a full slot.
    bool complete = 3;
}

message Transaction {
    uint64 slot       = 1;
    string signature  = 2;
    bytes  raw_tx     = 3;
    // Set on transactions emitted by the batch that finished the slot. See
    // Entry.complete — this is the same slot-completeness signal per-tx.
    bool   complete   = 4;
}

// Alpenglow block footer (SIMD-0326): the leader's own bank hash and clock for
// the block, carried in the block itself. Under Alpenglow votes never touch the
// chain, so this is the earliest — and the only in-band — source of both.
// `bank_hash` is what the leader executed, not a stake-weighted confirmation;
// finalization travels as certificates.
message Footer {
    uint64 slot                = 1;
    bytes  bank_hash           = 2; // 32 bytes
    uint64 producer_time_nanos = 3; // leader wall clock, ns since the Unix epoch
}

// A node as gossip describes it. What a node runs decides how it orders the
// transactions of the blocks it leads; the leader of a slot is looked up here
// by its identity. It is what the node says of itself, not something checked.
message Node {
    bytes  identity = 1; // 32 bytes
    string client   = 2; // Agave, JitoLabs, AgaveBam, HarmonicAgave, Firedancer, ...
    string version  = 3; // major.minor.patch
}

// The first message of a subscription holds every node known; each later one
// holds the nodes that appeared or changed since. Nodes are never removed.
message Nodes {
    repeated Node nodes = 1;
}

message SubscribeEntriesRequest {}
message SubscribeTransactionsRequest {}
message SubscribeFootersRequest {}
message SubscribeNodesRequest {}

service ShredstreamProxy {
    rpc SubscribeEntries(SubscribeEntriesRequest) returns (stream Entry);
    rpc SubscribeTransactions(SubscribeTransactionsRequest) returns (stream Transaction);
    rpc SubscribeFooters(SubscribeFootersRequest) returns (stream Footer);
    rpc SubscribeNodes(SubscribeNodesRequest) returns (stream Nodes);
}
