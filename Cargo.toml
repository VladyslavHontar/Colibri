# Workspace contains only the colibri binary.
# The deshredder library lives at /Users/newuser/RustroverProjects/Deshreder/
# as a standalone open-source crate.
[workspace]
members  = ["colibri"]
resolver = "2"

[workspace.dependencies]
# Deshredder now uses agave v3.1.5 (agave-unstable-api feature exposes the shred module).
# Colibri gossip also uses agave v3.1.5 → single rocksdb 0.23, no native lib conflict.
bincode = "1"
tokio   = { version = "1", features = ["full"] }
anyhow  = "1"

[profile.release]
lto           = "thin"
codegen-units = 1

# time-macros 0.2.27 uses `let chains` (Rust 2024 only); override time to use 0.3.36
# which pins time-macros to 0.2.18 (Rust 2021 compatible).
[patch.crates-io]
time = { path = "/Users/newuser/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/time-0.3.36" }
