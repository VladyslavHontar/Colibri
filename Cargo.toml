# Workspace contains only the colibri binary.
# The deshredder library is a standalone open-source crate published to crates.io.
[workspace]
members  = ["colibri"]
resolver = "2"

[workspace.dependencies]
# Deshredder now uses agave v3.1.5 (agave-unstable-api feature exposes the shred module).
# Colibri gossip also uses agave v3.1.5 → single rocksdb 0.23, no native lib conflict.
bincode = "1"
tokio   = { version = "1", features = ["full"] }
anyhow  = "1"

# LTO disabled: rustc 1.95 emits LLVM 22 bitcode that Apple's ld/libLTO (LLVM 21)
# cannot parse during thin-LTO link. LTO buys nothing for this measurement spike.
[profile.release]
lto           = "off"
codegen-units = 1

